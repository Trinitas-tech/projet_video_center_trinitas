validation:
    email:
        not_blank: The email cannot be empty.
        invalid: The email is not valid.
        max_length: The email cannot exceed {{ limit }} characters.
    password:
        not_blank: The password cannot be empty.
        mismatch: The passwords do not match.
        min_length: The password must contain at least {{ limit }} characters.
    firstname:
        not_blank: The first name cannot be empty.
        max_length: The first name cannot exceed {{ limit }} characters.
